name: Quality
on:
    schedule:
        - cron: '5 16 * * 3'
    pull_request:
        paths-ignore:
            - '**.md'
            - LICENSE

permissions:
    contents: read
    pull-requests: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['5.4', '6', '7', '8']
    # PHP 8.4 and 8.5 are the stable versions allowed by ^8.4.
    # setup-php installs the latest patch (PHPUnit 13 requires >=8.4.1).
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
      - name: Verify PCOV is loaded
        run: php --ri pcov
      - run: composer require 'symfony/validator:${{ matrix.symfony }}.*' --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction
      - name: Verify resolved Symfony branch
        env:
          EXPECTED_SYMFONY: ${{ matrix.symfony }}
        run: php tools/check-symfony.php
      - run: composer test
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcov
          coverage: pcov
          ini-values: pcov.directory=lib
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: composer install --prefer-dist --no-interaction
      - run: composer install-tools
      - run: npm install --ignore-scripts
      - run: npm audit
      - name: Validate root Composer manifest, audit dependencies and run all checks
        run: composer check
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: longitude-one/spatial-validator
          files: build/clover.xml
          disable_search: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: build/
