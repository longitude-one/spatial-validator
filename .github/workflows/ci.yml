name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['5.4', '6', '7', '8']
    # PHP 8.4 and 8.5 are the stable versions allowed by ^8.4.
    # setup-php installs the latest patch (PHPUnit 13 requires >=8.4.1).
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcov
          coverage: none
      - run: composer require 'symfony/validator:${{ matrix.symfony }}.*' --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction
      - name: Verify resolved Symfony branch
        env:
          EXPECTED_SYMFONY: ${{ matrix.symfony }}
        run: php tools/check-symfony.php
      - run: composer test
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcov
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --prefer-dist --no-interaction
      - run: composer install-tools
      - run: npm install --ignore-scripts
      - run: composer check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: build/
